services:
  app:
    build: .
    image: ${DOCKERHUB_USERNAME}/fintracker-api:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.fintracker.loadbalancer.server.port=8080"

      - "traefik.http.routers.fintracker-local.rule=Host(`api.suissetiawan.home`) && PathPrefix(`/fintracker`)"
      - "traefik.http.routers.fintracker-local.entrypoints=web"

      - "traefik.http.middlewares.fintracker-strip.stripprefix.prefixes=/fintracker"
      - "traefik.http.routers.fintracker-local.middlewares=fintracker-strip"

    container_name: api-fintracker
    ports:
      - "8082:8080"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - financial-tracker-network

networks:
  financial-tracker-network:
    name: financial-tracker-network
