services:
  app:
    build: .
    image: ${DOCKERHUB_USERNAME}/fintracker-api:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fintracker.rule=Host(`fintracker.suissetiawan.my.id`)"
      - "traefik.http.services.fintracker.loadbalancer.server.port=8080"
    container_name: fintracker-api
    ports:
      - "8082:8080"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - financial-tracker-network

networks:
  financial-tracker-network:
    name: financial-tracker-network
