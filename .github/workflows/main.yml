name: CI/CD - Build & Deploy (VPS)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: fintracker-api
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      APP_DIR: /home/deploy/apps/fintracker-api

    steps:
      # =========================
      # CHECKOUT CODE
      # =========================
      - name: Checkout source code
        uses: actions/checkout@v4

      # =========================
      # BUILD JAR (OPTIONAL VALIDATION)
      # =========================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build application with Maven
        run: mvn clean package -DskipTests

      # =========================
      # DOCKER BUILD & PUSH
      # =========================
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      # =========================
      # SSH PREP (RUNNER SIDE)
      # =========================
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install cloudflared (runner only)
        run: |
          curl -L https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update
          sudo apt-get install cloudflared

      # ====================================
      # DEPLOY TO VPS via Cloudflare Tunnel
      # ====================================
      - name: Setup SSH config for Cloudflare Tunnel
        run: |
          cat >> ~/.ssh/config << 'EOF'
          Host vps-deploy
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Create directory and copy docker-compose.yml
        run: |
          # create dir if not exist
          ssh vps-deploy "mkdir -p ${{ env.APP_DIR }}"

          # copy docker-compose (overwrite is expected)
          scp docker-compose.yml vps-deploy:${{ env.APP_DIR }}/docker-compose.yml

      - name: Deploy on VPS
        run: |
          ssh vps-deploy << 'EOF'
              set -e
              cd ${{ env.APP_DIR }}

              echo "📥 Pulling latest image..."
              docker compose pull

              echo "🔄 Restarting containers..."
              docker compose up -d

              echo "✅ Deployment finished"
              docker compose ps
          EOF
